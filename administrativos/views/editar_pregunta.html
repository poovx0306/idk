$def with (pregunta_id, texto, seccion, numero, cuestionario_titulo, cuestionario_id)
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CONAAP - Editar Pregunta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary bg-opacity-25">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-lg border-0 rounded-4 w-50 bg-white">
            <h3 class="fw-bold mb-3">Editar Pregunta</h3>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Título del cuestionario</label>
                    <input type="text" class="form-control" value="$cuestionario_titulo" disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Texto de la pregunta</label>
                    <input type="text" class="form-control" name="texto" value="$texto" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted small fw-bold">Sección / Área</label>
                        <input type="text" class="form-control" name="seccion" value="$seccion" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted small fw-bold">Número de pregunta</label>
                        <input type="number" class="form-control" name="numero" value="$numero" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="/administrativo/cuestionarios/ver_preguntas?id=$cuestionario_id" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-danger px-4" style="background-color: #721c24; border-color: #721c24;">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
