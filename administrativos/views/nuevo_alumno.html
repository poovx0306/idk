$def with (lista_docentes=[], error='')

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<style>
    :root {
        --color-principal: #6c1d33;
        --color-principal-hover: #541628;
        --color-fondo-general: #6e6568;
    }

    body {
        background-color: var(--color-fondo-general);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem 0;
    }

    .card-formulario {
        background: #ffffff;
        border-radius: 20px;
        padding: 2.5rem;
        width: 100%;
        max-width: 600px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .form-label {
        font-weight: 600;
        font-size: 0.85rem;
        color: #2d3748;
        margin-bottom: 0.4rem;
    }

    .form-control, .form-select {
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        font-size: 0.95rem;
        color: #4a5568;
        background-color: #f8fafc;
    }

    .form-control:focus, .form-select:focus {
        border-color: var(--color-principal);
        box-shadow: 0 0 0 3px rgba(108, 29, 51, 0.1);
        background-color: #fff;
    }

    .alert-error {
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        border-radius: 10px;
        font-size: 0.85rem;
        padding: 0.85rem 1rem;
    }

    .btn-cancelar {
        background-color: #ffffff;
        color: #2d3748;
        border: 1px solid #cbd5e0;
        border-radius: 12px;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        text-align: center;
        transition: background-color 0.2s;
    }

    .btn-cancelar:hover {
        background-color: #f7fafc;
        color: #2d3748;
    }

    .btn-registrar-alumno {
        background-color: var(--color-principal);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        transition: background-color 0.2s;
    }

    .btn-registrar-alumno:hover {
        background-color: var(--color-principal-hover);
        color: white;
    }
</style>

<div class="card-formulario">
    <h3 class="fw-bold text-dark mb-4">Registrar alumno</h3>

    $if error:
        <div class="alert-error mb-3">
            <i class="bi bi-exclamation-triangle me-2"></i>$error
        </div>

    <form method="POST" action="/administrativo/alumnos/nuevo">
        <!-- Nombre completo -->
        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" name="nombre" class="form-control" placeholder="Ej. Juan Pérez López" required>
        </div>

        <!-- Edad y Grado -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Edad</label>
                <input type="number" name="edad" class="form-control" placeholder="Ej. 7" min="0" max="18" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Grado</label>
                <select name="grado" class="form-select" required>
                    <option value="" selected disabled>Selecciona el grado</option>
                    <option value="1°">1°</option>
                    <option value="2°">2°</option>
                    <option value="3°">3°</option>
                </select>
            </div>
        </div>

        <!-- Condición y Docente Asignado -->
        <div class="row mb-4">
            <div class="col-md-6">
                <label class="form-label">Condición</label>
                <input type="text" name="condicion" class="form-control" placeholder="Ej. Autismo (TEA)" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Docente asignado</label>
                <select name="id_docente1" class="form-select" required>
                    <option value="" selected disabled>Selecciona un docente</option>
                    $for doc in lista_docentes:
                        <option value="$doc['id_docente']">$doc['nombre']</option>
                </select>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="d-flex justify-content-between align-items-center">
            <a href="/administrativo/alumnos" class="btn-cancelar">Cancelar</a>
            <button type="submit" class="btn-registrar-alumno">Registrar alumno</button>
        </div>
    </form>
</div>
