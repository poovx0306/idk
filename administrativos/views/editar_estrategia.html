$def with (actividad)
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONAAP - Editar Actividad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --sidebar-width: 250px;
            --primary-burgundy: #5c1428;
            --hover-burgundy: #731331;
            --bg-light: #f8f6f6;
        }
        body {
            background-color: var(--bg-light);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
        }
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background-color: var(--primary-burgundy);
            color: white;
            position: fixed;
            top: 0; left: 0; z-index: 1000;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem 1rem;
            box-sizing: border-box;
        }
        .sidebar-brand { font-size: 1.5rem; font-weight: 700; color: #ffffff; text-decoration: none; }
        .sidebar-menu { display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar-menu a {
            color: rgba(255,255,255,0.8); text-decoration: none; display: block;
            padding: 0.6rem 1rem; border-radius: 8px; margin-bottom: 0.3rem; font-size: 0.95rem;
        }
        .sidebar-menu a.active, .sidebar-menu a:hover {
            background-color: var(--hover-burgundy); color: #ffffff;
        }
        .main-content { margin-left: var(--sidebar-width); padding: 2.5rem; min-height: 100vh; }
        .btn-burgundy {
            background-color: var(--primary-burgundy); color: #ffffff; border: none;
            padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; text-decoration: none;
        }
        .btn-burgundy:hover { background-color: var(--hover-burgundy); color: #ffffff; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div>
            <a href="/administrativo/inicio" class="sidebar-brand">CONAAP</a>
            <div class="sidebar-menu mt-4">
                <a href="/administrativo/inicio">Inicio</a>
                <a href="/administrativo/cuestionarios">Cuestionarios</a>
                <a href="/administrativo/resultados">Resultados</a>
                <a href="/administrativo/estrategias" class="active">Estrategias didácticas</a>
                <a href="/administrativo/docentes">Docentes</a>
                <a href="/administrativo/alumnos">Alumnos</a>
                <a href="/administrativo/padres">Padres de familia</a>
            </div>
        </div>
        <div>
            <a href="/cerrar-sesion" class="text-white-50 text-decoration-none small">
                <i class="bi bi-box-arrow-left me-2"></i>Cerrar sesión
            </a>
        </div>
    </nav>

    <main class="main-content">
        <div class="mb-4">
            <a href="/administrativo/estrategias" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left me-1"></i> Volver a Estrategias
            </a>
            <h2 class="fw-bold mt-2 mb-0">Editar Actividad</h2>
        </div>

        <div class="bg-white p-4 rounded-3 shadow-sm" style="max-width: 800px;">
            <form action="/administrativo/estrategias/editar" method="POST">
                <input type="hidden" name="id" value="$actividad['id']">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Título</label>
                    <input type="text" name="titulo" class="form-control" value="$actividad['titulo']" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3">$(actividad['descripcion'] or '')</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Objetivo</label>
                    <textarea name="objetivo" class="form-control" rows="2">$(actividad['objetivo'] or '')</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Materiales</label>
                    <textarea name="materiales" class="form-control" rows="2">$(actividad['materiales'] or '')</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Paso a paso</label>
                    <textarea name="paso_a_paso" class="form-control" rows="3">$(actividad['paso_a_paso'] or '')</textarea>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Materia</label>
                        <select name="materia" class="form-select">
                            <option value="Matematicas" ${'selected' if actividad['materia'] == 'Matematicas' else ''}>Matemáticas</option>
                            <option value="Español" ${'selected' if actividad['materia'] == 'Español' else ''}>Español</option>
                            <option value="Habilidades sociales" ${'selected' if actividad['materia'] == 'Habilidades sociales' else ''}>Habilidades sociales</option>
                            <option value="Motricidad" ${'selected' if actividad['materia'] == 'Motricidad' else ''}>Motricidad</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Grado</label>
                        <select name="grado" class="form-select">
                            <option value="1°" ${'selected' if actividad['grado'] == '1°' else ''}>1°</option>
                            <option value="2°" ${'selected' if actividad['grado'] == '2°' else ''}>2°</option>
                            <option value="3°" ${'selected' if actividad['grado'] == '3°' else ''}>3°</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Grupo</label>
                        <input type="text" name="grupo" class="form-control" value="$(actividad['grupo'] or '')">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Estado</label>
                    <select name="estado" class="form-select">
                        <option value="Pendiente" ${'selected' if actividad['estado'] == 'Pendiente' else ''}>Pendiente</option>
                        <option value="Completada" ${'selected' if actividad['estado'] == 'Completada' else ''}>Completada</option>
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="/administrativo/estrategias" class="btn btn-light border">Cancelar</a>
                    <button type="submit" class="btn btn-burgundy">Guardar cambios</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
