<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONAAP - Nuevo Cuestionario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --sidebar-width: 250px;
            --primary-burgundy: #5c1428;
            --hover-burgundy: #731331;
            --bg-light: #f8f6f6;
        }

        body {
            background-color: var(--bg-light);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
        }

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background-color: var(--primary-burgundy);
            color: #ffffff;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem 1rem;
            box-sizing: border-box;
        }

        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
        }

        .sidebar-menu a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            display: block;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.3rem;
        }

        .sidebar-menu a.active, .sidebar-menu a:hover {
            background-color: var(--hover-burgundy);
            color: #ffffff;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2.5rem;
            min-height: 100vh;
        }

        .btn-burgundy {
            background-color: var(--primary-burgundy);
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-burgundy:hover {
            background-color: var(--hover-burgundy);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div>
            <a href="/administrativo/inicio" class="sidebar-brand">CONAAP</a>
            <div class="sidebar-menu mt-4">
                <a href="/administrativo/inicio">Inicio</a>
                <a href="/administrativo/cuestionarios" class="active">Cuestionarios</a>
                <a href="/administrativo/resultados">Resultados</a>
                <a href="/administrativo/estrategias">Temas</a>
                <a href="/administrativo/docentes">Docentes</a>
                <a href="/administrativo/alumnos">Alumnos</a>
                <a href="/administrativo/padres">Padres de familia</a>
            </div>
        </div>
        <div>
            <a href="/cerrar-sesion" class="text-white-50 text-decoration-none small">
                <i class="bi bi-box-arrow-left me-2"></i>Cerrar sesión
            </a>
        </div>
    </nav>

    <main class="main-content">
        <div class="mb-4">
            <a href="/administrativo/cuestionarios" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left me-1"></i> Volver a Cuestionarios
            </a>
            <h2 class="fw-bold text-dark mt-2">Crear Nuevo Cuestionario</h2>
        </div>

        <div class="bg-white p-4 rounded-3 shadow-sm" style="max-width: 700px;">
            <form action="/administrativo/cuestionarios/nuevo" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Título del Cuestionario</label>
                    <input type="text" name="titulo" class="form-control" placeholder="Ej. Tamizaje de Desarrollo Cognitivo" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3" placeholder="Breve descripción del propósito de este tamizaje..."></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="/administrativo/cuestionarios" class="btn btn-light border">Cancelar</a>
                    <button type="submit" class="btn btn-burgundy">Guardar Cuestionario</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
