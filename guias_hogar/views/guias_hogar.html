$def with (seccion, guias)

<div class="sidebar">
    <div class="logo-box">
        <img src="/static/images/conafe.jpg" alt="CONAFE">
        <p>Consejo Nacional de Fomento Educativo</p>
    </div>
    <nav>
        <a href="/padre/inicio" class="$('active' if seccion=='inicio' else '')">Inicio</a>
        <a href="/padre/guias" class="$('active' if seccion=='guias' else '')">Guías para el hogar</a>
        <a href="/padre/postcrisis" class="$('active' if seccion=='postcrisis' else '')">Actividades post-crisis</a>
        <a href="/padre/avance" class="$('active' if seccion=='avance' else '')">Avance de mi hijo</a>
        <a href="/padre/perfil" class="$('active' if seccion=='perfil' else '')">Mi Perfil</a>
    </nav>
    <a href="/logout" class="cerrar-sesion">Cerrar sesión</a>
</div>

<div class="contenido">
    <div class="header">
        <h1>Guías para el hogar</h1>
        <p>Estrategias prácticas para apoyar a tu hijo en casa</p>
    </div>

    <div class="lista-guias">
        $for g in guias:
            <div class="card-guia">
                <h3>$g.titulo</h3>
                <p>$g.contenido</p>
            </div>
    </div>
</div>
