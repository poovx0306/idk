$def with ()

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario - CONAAP</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-guinda { background-color: #7A1C37; color: white; }
        .btn-guinda:hover { background-color: #501223; color: white; }
        .badge-turquesa { background-color: #E8F6F5; color: #20B2AA; }
    </style>
</head>
<body class="bg-light">

    <!-- Encabezado con logo y botón de retorno -->
    <nav class="navbar navbar-light bg-white border-bottom py-2">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/static/conafe.jpg" alt="CONAFE" height="50">
            </a>
            <a href="/" class="btn btn-outline-secondary btn-sm">← Volver al inicio</a>
        </div>
    </nav>

    <!-- Tarjeta del Cuestionario -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <span class="badge badge-turquesa px-3 py-2 rounded-pill">Detección Temprana</span>
                        <small class="text-muted">3 preguntas rápidas</small>
                    </div>

                    <h3 class="fw-bold text-dark mb-2">Cuestionario de Evaluación</h3>
                    <p class="text-muted mb-4">Selecciona la opción que mejor describa la conducta observada en el infante.</p>

                    <!-- Formulario que envía las respuestas al POST de Python -->
                    <form action="/deteccion-temprana" method="POST">
                        
                        <!-- Pregunta 1 -->
                        <div class="card bg-white border mb-3 p-3 rounded-3">
                            <label class="form-label fw-bold mb-2">1. ¿El infante mantiene contacto visual al interactuar con otras personas?</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="p1" id="p1_a" value="frecuente" required>
                                <label class="form-check-label" for="p1_a">Sí, con frecuencia</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="p1" id="p1_b" value="a_veces">
                                <label class="form-check-label" for="p1_b">A veces</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="p1" id="p1_c" value="raro">
                                <label class="form-check-label" for="p1_c">Rara vez o evita la mirada</label>
                            </div>
                        </div>

                        <!-- Pregunta 2 -->
                        <div class="card bg-white border mb-3 p-3 rounded-3">
                            <label class="form-label fw-bold mb-2">2. ¿Responde de forma receptiva cuando se le llama por su nombre?</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="p2" id="p2_a" value="frecuente" required>
                                <label class="form-check-label" for="p2_a">Sí, atiende de inmediato</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="p2" id="p2_b" value="a_veces">
                                <label class="form-check-label" for="p2_b">A veces hay que repetírselo</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="p2" id="p2_c" value="raro">
                                <label class="form-check-label" for="p2_c">Parece no escuchar o ignora el llamado</label>
                            </div>
                        </div>

                        <!-- Pregunta 3 -->
                        <div class="card bg-white border mb-4 p-3 rounded-3">
                            <label class="form-label fw-bold mb-2">3. ¿Muestra molestia o hipersensibilidad intensa ante ruidos fuertes o luces?</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="p3" id="p3_a" value="frecuente" required>
                                <label class="form-check-label" for="p3_a">No, reacciona de manera habitual</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="p3" id="p3_b" value="a_veces">
                                <label class="form-check-label" for="p3_b">En ocasiones le incomoda</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="p3" id="p3_c" value="raro">
                                <label class="form-check-label" for="p3_c">Sí, le causa crisis o gran malestar</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-guinda w-100 py-2 rounded-3 fw-bold">
                            Enviar y ver diagnóstico
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
