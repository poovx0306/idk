$def with (ninos)

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona a tu hijo - CONAAP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #6a1c32;
            min-height: 100vh;
        }
        .btn-guinda {
            background-color: #3b111d;
            color: white;
        }
        .btn-guinda:hover {
            background-color: #240a12;
            color: white;
        }
        .linea-decorativa {
            width: 80px;
            height: 4px;
            background-color: #8c3b52;
            margin: 0 auto;
            border-radius: 2px;
        }
        .nino-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }
        .nino-card:hover {
            background-color: #f1f5f9;
        }
        .nino-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: #6a1c32;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="d-flex align-items-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="bg-white rounded-4 shadow-lg p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h4 class="fw-bold text-dark px-3">
                            ¿Con cuál de tus hijos quieres continuar?
                        </h4>
                        <div class="linea-decorativa mt-3"></div>
                    </div>

                    <div class="card border-0 bg-light rounded-4 p-4 mb-4">
                        $for nino in ninos:
                            <a href="/padre/elegir-nino?id_infante=$nino['id_infante']" class="nino-card rounded-3 p-3 mb-2 bg-white shadow-sm">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="nino-avatar">$nino['nombre'][0]</div>
                                    <div>
                                        <div class="fw-bold">$nino['nombre']</div>
                                        <div class="text-muted small">$nino['edad'] años</div>
                                    </div>
                                </div>
                                <span class="text-muted">&rarr;</span>
                            </a>

                        $if not ninos:
                            <p class="text-muted text-center mb-0">Todavía no tienes niños registrados.</p>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="/cerrar-sesion" class="btn btn-outline-secondary px-4 py-2 rounded-3">Cerrar sesión</a>
                        <a href="/registro-nino" class="btn btn-guinda px-4 py-2 rounded-3">+ Registrar otro niño</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
