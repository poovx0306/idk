$def with ()

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro del Niño - CONAAP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #6a1c32;
            min-height: 100vh;
        }
        .btn-guinda {
            background-color: #3b111d;
            color: white;
        }
        .btn-guinda:hover {
            background-color: #240a12;
            color: white;
        }
        .linea-decorativa {
            width: 80px;
            height: 4px;
            background-color: #8c3b52;
            margin: 0 auto;
            border-radius: 2px;
        }
    </style>
</head>
<body class="d-flex align-items-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="bg-white rounded-4 shadow-lg p-4 p-md-5">
                    
                    <!-- Encabezado de la tarjeta -->
                    <div class="text-center mb-4">
                        <h4 class="fw-bold text-dark px-3">
                            Usaremos estos datos para personalizar el cuestionario y tu reporte. Tu información es confidencial.
                        </h4>
                        <div class="linea-decorativa mt-3"></div>
                    </div>

                    <!-- Formulario de Datos -->
                    <form action="/registro-nino" method="POST" class="mt-4">
                        <div class="card border-0 bg-light rounded-4 p-4 mb-4">
                            
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Nombre(s)</label>
                                <input type="text" name="nombre" class="form-control form-control-lg fs-6 rounded-3" placeholder="Ej. María José" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Primer apellido</label>
                                <input type="text" name="primer_apellido" class="form-control form-control-lg fs-6 rounded-3" placeholder="Ej. Hernández" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Edad</label>
                                <input type="text" name="edad" class="form-control form-control-lg fs-6 rounded-3" placeholder="Ej. 4 años" required>
                            </div>

                            <small class="text-success fw-semibold">
                                • Tus respuestas son anónimas y privadas.
                            </small>
                        </div>

                        <!-- Botones de navegación -->
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="/" class="btn btn-outline-secondary px-4 py-2 rounded-3">Anterior</a>
                            <button type="submit" class="btn btn-guinda px-4 py-2 rounded-3">Siguiente &rarr;</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
