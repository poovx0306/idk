$def with (cuestionario, preguntas)
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONAAP - Editar Cuestionario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #837c80; /* Fondo gris opaco como tu imagen */
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 2rem;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.4rem;
        }

        .form-control, .form-select {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            color: #475569;
        }

        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: #5c1428;
            box-shadow: 0 0 0 3px rgba(92, 20, 40, 0.1);
        }

        .alert-info-custom {
            background-color: #e6fffa;
            color: #0d9488;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 0.825rem;
            line-height: 1.4;
        }

        .btn-cancel {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            width: 48%;
        }

        .btn-cancel:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .btn-submit {
            background-color: #731331;
            border: none;
            color: #ffffff;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            width: 48%;
        }

        .btn-submit:hover {
            background-color: #5c1428;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="modal-card">
        <h3 class="fw-bold text-dark mb-4">Agregar nueva pregunta</h3>

        <form action="/administrativo/cuestionarios/editar" method="POST">
            <input type="hidden" name="cuestionario_id" value="$cuestionario['id']">

            <!-- Título del Cuestionario -->
            <div class="mb-3">
                <label class="form-label">Título del cuestionario</label>
                <input type="text" name="titulo_cuestionario" class="form-control" value="$cuestionario['titulo']" required>
            </div>

            <!-- Nueva Pregunta -->
            <div class="mb-3">
                <label class="form-label">Nueva pregunta para agregar</label>
                <input type="text" name="texto_pregunta" class="form-control" placeholder="Ej. ¿El niño responde cuando se le llama por su nombre?">
            </div>

            <!-- Sección -->
            <div class="row mb-3">
                <div class="col-6">
                    <label class="form-label">Sección / Área</label>
                    <input type="text" name="seccion" class="form-control" placeholder="Ej. Interacción Social">
                </div>
                <div class="col-6">
                    <label class="form-label">Número de pregunta</label>
                    <input type="number" name="numero_pregunta" class="form-control" placeholder="Ej. 1">
                </div>
            </div>

            <!-- Alerta informadora verde -->
            <div class="alert-info-custom mb-4">
                Se guardarán los cambios del título y la nueva pregunta se asociará directamente al cuestionario <strong>#$cuestionario['id']</strong>.
            </div>

            <!-- Botones de Acción -->
            <div class="d-flex justify-content-between align-items-center">
                <a href="/administrativo/cuestionarios" class="btn-cancel">Cancelar</a>
                <button type="submit" class="btn-submit">Guardar cambios</button>
            </div>
        </form>
    </div>

</body>
</html>
