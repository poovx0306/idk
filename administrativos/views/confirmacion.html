$def with (titulo='Operación exitosa', mensaje='', volver_url='/administrativo/inicio', volver_texto='Volver', tipo='ok')

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<style>
    :root {
        --color-principal: #6c1d33;
        --color-principal-hover: #541628;
        --color-fondo-general: #6e6568;
        --color-verde: #109384;
    }

    body {
        background-color: var(--color-fondo-general);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem 0;
    }

    .card-confirmacion {
        background: #ffffff;
        border-radius: 20px;
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        text-align: center;
    }

    .icono-estado {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        margin: 0 auto 1.5rem auto;
    }

    .icono-ok {
        background-color: #e6f9f5;
        color: var(--color-verde);
    }

    .icono-error {
        background-color: #fef2f2;
        color: #d32f2f;
    }

    .card-confirmacion h3 {
        font-weight: 700;
        color: #2d3748;
        font-size: 1.4rem;
        margin-bottom: 0.75rem;
    }

    .card-confirmacion p {
        color: #718096;
        font-size: 0.95rem;
        margin-bottom: 2rem;
    }

    .btn-volver {
        background-color: var(--color-principal);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 0.75rem 2rem;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        transition: background-color 0.2s;
    }

    .btn-volver:hover {
        background-color: var(--color-principal-hover);
        color: white;
    }
</style>

<div class="card-confirmacion">
    $if tipo == 'ok':
        <div class="icono-estado icono-ok">
            <i class="bi bi-check-lg"></i>
        </div>
    $else:
        <div class="icono-estado icono-error">
            <i class="bi bi-exclamation-triangle"></i>
        </div>

    <h3>$titulo</h3>

    $if mensaje:
        <p>$mensaje</p>

    <a href="$volver_url" class="btn-volver">$volver_texto</a>
</div>
