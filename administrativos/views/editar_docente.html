$def with (docente, error='')

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<style>
    :root {
        --color-principal: #6c1d33;
        --color-principal-hover: #541628;
        --color-fondo-general: #6e6568;
    }

    body {
        background-color: var(--color-fondo-general);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem 0;
    }

    .card-formulario {
        background: #ffffff;
        border-radius: 20px;
        padding: 2.5rem;
        width: 100%;
        max-width: 600px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .form-label {
        font-weight: 600;
        font-size: 0.85rem;
        color: #2d3748;
        margin-bottom: 0.4rem;
    }

    .form-control {
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        font-size: 0.95rem;
        color: #4a5568;
        background-color: #f8fafc;
    }

    .form-control:focus {
        border-color: var(--color-principal);
        box-shadow: 0 0 0 3px rgba(108, 29, 51, 0.1);
        background-color: #fff;
    }

    .alert-notif {
        background-color: #e6f9f5;
        border: 1px solid #b2f5ea;
        color: #0b6b5f;
        border-radius: 10px;
        font-size: 0.85rem;
        padding: 0.85rem 1rem;
    }

    .alert-error {
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        border-radius: 10px;
        font-size: 0.85rem;
        padding: 0.85rem 1rem;
    }

    .btn-cancelar {
        background-color: #ffffff;
        color: #2d3748;
        border: 1px solid #cbd5e0;
        border-radius: 12px;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        text-align: center;
        transition: background-color 0.2s;
    }

    .btn-cancelar:hover {
        background-color: #f7fafc;
        color: #2d3748;
    }

    .btn-registrar-docente {
        background-color: var(--color-principal);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        transition: background-color 0.2s;
    }

    .btn-registrar-docente:hover {
        background-color: var(--color-principal-hover);
        color: white;
    }
</style>

<div class="card-formulario">
    <h3 class="fw-bold text-dark mb-4">Editar docente</h3>

    $if error:
        <div class="alert-error mb-3">
            <i class="bi bi-exclamation-triangle me-2"></i>$error
        </div>

    <form method="POST" action="/administrativo/docentes/editar">
        <input type="hidden" name="id" value="$docente['id']">

        <!-- Nombre completo -->
        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" name="nombre" class="form-control" value="$docente['nombre']" required>
        </div>

        <!-- Correo institucional -->
        <div class="mb-3">
            <label class="form-label">Correo institucional</label>
            <input type="email" name="correo" class="form-control" value="$docente['correo']" required>
        </div>

        <!-- Clave y Alumnos -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Clave de docente</label>
                <input type="text" name="clave" class="form-control" value="$docente['clave']" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Alumnos asignados</label>
                <input type="number" name="alumnos" class="form-control" value="$docente['alumnos']" min="0">
            </div>
        </div>

        <!-- Contraseña nueva (opcional) -->
        <div class="mb-4">
            <label class="form-label">Contraseña nueva (opcional)</label>
            <input type="password" name="password" class="form-control" placeholder="Déjalo vacío para no cambiarla">
        </div>

        <!-- Alerta informativa -->
        <div class="alert alert-notif mb-4" role="alert">
            Los cambios de nombre y correo se aplican también en la cuenta de acceso del docente.
        </div>

        <!-- Botones de Acción -->
        <div class="d-flex justify-content-between align-items-center">
            <a href="/administrativo/docentes" class="btn-cancelar">Cancelar</a>
            <button type="submit" class="btn-registrar-docente">Guardar cambios</button>
        </div>
    </form>
</div>
