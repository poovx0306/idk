$def with (seccion, ninos)

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CONAAP - Actividades post-crisis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f1f5f9; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: #ffffff; border-right: 1px solid #e2e8f0; padding: 24px 0; display: flex; flex-direction: column; }
    .logo { padding: 18px 20px 26px; text-align: center; }
    .logo img { max-width: 160px; width: 100%; height: auto; object-fit: contain; }
    .nav-item { margin: 2px 12px; padding: 11px 12px; border-radius: 10px; font-size: 14px; color: #1e293b; text-decoration: none; display: flex; align-items: center; gap: 10px; }
    .nav-item svg { flex-shrink: 0; }
    .nav-item:hover { background-color: #f1f5f9; }
    .nav-item.active { font-weight: 600; color: #0f766e; background: #f0fdfa; }
    .sidebar-footer { margin-top: auto; border-top: 1px solid #e2e8f0; padding: 18px 24px 0; }
    .sidebar-footer a { font-size: 13px; color: #64748b; text-decoration: none; }
    .content { flex: 1; }
    .header { background: #fff; padding: 24px 36px; border-bottom: 1px solid #e2e8f0; }
    .header h1 { font-size: 20px; color: #1e293b; }
    .header p { font-size: 13px; color: #64748b; margin-top: 2px; }
    .main { padding: 28px 36px; max-width: 520px; }
    .nino-card { display: block; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px 20px; margin-bottom: 12px; text-decoration: none; color: #1e293b; }
    .nino-card:hover { background: #f8fafc; border-color: #0f766e; }
    .nino-nombre { font-weight: 700; font-size: 15px; }
    .nino-edad { font-size: 13px; color: #64748b; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo"><img src="/static/images/conafe.jpg" alt="CONAFE"></div>

      <a href="/padre/inicio" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>
        Inicio
      </a>
      <a href="/padre/guias" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        Guías para el hogar
      </a>
      <a href="/padre/postcrisis" class="nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"></path></svg>
        Actividades post-crisis
      </a>
      <a href="/padre/avance" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
        Avance de mi hijo
      </a>
      <a href="/padre/actividades-casa" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg>
        Actividades en casa
      </a>
      <a href="/padre/perfil" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Mi Perfil
      </a>
      <div class="sidebar-footer">
        <a href="/cerrar-sesion">Cerrar sesión</a>
      </div>
    </aside>

    <div class="content">
      <header class="header">
        <h1>Actividades post-crisis</h1>
        <p>Selecciona a cuál niño quieres ver</p>
      </header>

      <main class="main">
        $for nino in ninos:
          <a class="nino-card" href="/padre/postcrisis?id_infante=$nino['id_infante']">
            <div class="nino-nombre">$nino['nombre']</div>
            <div class="nino-edad">$nino['edad'] años</div>
          </a>
      </main>
    </div>
  </div>
</body>
</html>
